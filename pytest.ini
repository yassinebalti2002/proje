[pytest]
# Répertoire par défaut des tests
testpaths = tests

# Affichage compact des erreurs
addopts = --tb=short -q

# Encodage pour les fichiers de log pytest
log_cli_date_format = %H:%M:%S
log_cli_format = %(asctime)s [%(levelname)s] %(message)s

# Filtres de warnings
filterwarnings =
    ignore::DeprecationWarning:scipy.*
    ignore::RuntimeWarning:numpy.*
    ignore::RuntimeWarning:scipy.*
