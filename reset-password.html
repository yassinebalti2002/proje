<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialiser le mot de passe — Novation City</title>
<script src="theme-toggle.js"></script>
<link rel="stylesheet" href="theme-toggle.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --bg:     #0d1117;
    --bg2:    #161b22;
    --bg3:    #1c2128;
    --bg4:    #21262d;
    --teal:   #00d4b4;
    --red:    #f85149;
    --green:  #3fb950;
    --blue:   #58a6ff;
    --text:   #e6edf3;
    --text2:  #8b949e;
    --text3:  #484f58;
    --border: rgba(255,255,255,0.08);
    --body-bg: radial-gradient(circle at 30% 25%, #123a58 0%, #060b16 62%);
    --star1: rgba(127,231,214,0.65);
    --star2: rgba(88,166,255,0.5);
    --font:   'Inter', sans-serif;
    --mono:   'JetBrains Mono', monospace;
    --r:      8px;
  }

  :root[data-theme="light"] {
    --bg:     #ffffff;
    --bg2:    #f6f8fa;
    --bg3:    #eaeef2;
    --bg4:    #d0d7de;
    --teal:   #00967d;
    --red:    #cf222e;
    --green:  #1a7f37;
    --blue:   #0969da;
    --text:   #1f2328;
    --text2:  #59636e;
    --text3:  #6e7781;
    --border: rgba(31,35,40,0.15);
    --body-bg: radial-gradient(circle at 30% 25%, #eaf3fb 0%, #ffffff 62%);
    --star1: rgba(0,150,125,0.35);
    --star2: rgba(9,105,218,0.3);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { height: 100%; }

  body {
    position: relative;
    color: var(--text);
    font-family: var(--font);
    display: flex;
    min-height: 100vh;
    background: var(--body-bg);
    overflow: hidden;
  }

  .bg-stars {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle, var(--star1) 1px, transparent 1.6px),
      radial-gradient(circle, var(--star2) 1px, transparent 1.6px);
    background-size: 180px 180px, 260px 260px;
    background-position: 0 0, 40px 60px;
    animation: stars-drift 50s linear infinite;
  }
  @keyframes stars-drift {
    from { background-position: 0 0, 40px 60px; }
    to   { background-position: 180px 180px, 300px 320px; }
  }

  .form-panel {
    position: relative;
    z-index: 1;
    flex: 1 1 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .form-inner { width: 100%; max-width: 440px; }

  .logo { display:flex; align-items:center; gap:14px; margin-bottom: 22px; }

  .logo-icon {
    width: 46px; height: 46px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--teal), var(--blue));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .logo-icon svg { width: 25px; height: 25px; }

  .logo-text { font-size: 1.55rem; font-weight: 800; letter-spacing: 0.5px; color: var(--text); }

  .brand-tag {
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: var(--teal);
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
  .subtitle { color: var(--text2); font-size: 1rem; margin-bottom: 28px; }

  label {
    display: block; font-size: 0.8rem; font-weight: 600; color: var(--text2);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
  }

  .field { margin-bottom: 20px; }

  input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 13px 15px;
    color: var(--text);
    font-family: var(--font);
    font-size: 1.02rem;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--teal); }

  .input-wrap { position: relative; }
  .input-wrap input { padding-right: 44px; }
  .toggle-pw {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text2);
    cursor: pointer;
    transition: color 0.15s;
  }
  .toggle-pw:hover { color: var(--text); }
  .toggle-pw svg { width: 19px; height: 19px; }
  .toggle-pw .eye-off { display: none; }
  .toggle-pw.is-visible .eye { display: none; }
  .toggle-pw.is-visible .eye-off { display: block; }

  button[type="submit"] {
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    border: none;
    border-radius: var(--r);
    background: linear-gradient(135deg, var(--teal), var(--blue));
    color: #04110d;
    font-family: var(--font);
    font-weight: 700;
    font-size: 1.02rem;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button[type="submit"]:hover { opacity: 0.9; }
  button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

  .msg {
    margin-top: 14px;
    padding: 9px 12px;
    border-radius: var(--r);
    font-size: 0.82rem;
    display: none;
  }
  .msg.error   { display:block; background: rgba(248,81,73,0.12);  color: var(--red);   border: 1px solid rgba(248,81,73,0.3); }
  .msg.success { display:block; background: rgba(63,185,80,0.12);  color: var(--green); border: 1px solid rgba(63,185,80,0.3); }

  .footer-link {
    margin-top: 20px;
    text-align: center;
    font-size: 0.82rem;
    color: var(--text2);
  }
  .footer-link a { color: var(--teal); text-decoration: none; font-weight: 600; }
  .footer-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="theme-toggle-fixed">
  <button class="theme-toggle-btn" data-theme-toggle-btn type="button" aria-label="Changer de thème">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</div>

<div class="bg-stars"></div>

<div class="form-panel">
  <div class="form-inner">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="2 14 7 14 9 8 13 20 16 4 18 14 22 14"/>
        </svg>
      </div>
      <div class="logo-text">NOVATION CITY</div>
    </div>
    <div class="brand-tag">Maintenance Prédictive</div>

    <h2>Nouveau mot de passe</h2>
    <p class="subtitle">Choisissez un nouveau mot de passe pour votre compte</p>

    <form id="reset-form">
      <div class="field">
        <label for="password">Nouveau mot de passe</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="toggle-pw" data-target="password" aria-label="Afficher le mot de passe">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.36 20.36 0 0 1-3.22 4.36M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="password2">Confirmer le mot de passe</label>
        <div class="input-wrap">
          <input type="password" id="password2" name="password2" autocomplete="new-password" minlength="8" required>
          <button type="button" class="toggle-pw" data-target="password2" aria-label="Afficher le mot de passe">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.36 20.36 0 0 1-3.22 4.36M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" id="submit-btn">Réinitialiser le mot de passe</button>
      <div id="msg" class="msg"></div>
    </form>

    <div class="footer-link">
      <a href="login.html">&larr; Retour à la connexion</a>
    </div>
  </div>
</div>

<script>
  let API_BASE = `https://${window.location.hostname}:8000`;
  async function detectApiBase() {
    for (const scheme of ['https', 'http']) {
      try {
        const candidate = `${scheme}://${window.location.hostname}:8000`;
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 2500);
        const res = await fetch(`${candidate}/health`, { signal: ctrl.signal });
        clearTimeout(timer);
        if (res.ok) { API_BASE = candidate; return; }
      } catch (e) { /* essaie le schéma suivant */ }
    }
  }
  const _apiReady = detectApiBase();

  const token = new URLSearchParams(window.location.search).get('token');
  const form = document.getElementById('reset-form');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submit-btn');

  if (!token) {
    form.style.display = 'none';
    msg.textContent = "Lien invalide — aucun jeton trouvé dans l'URL. Redemandez un email depuis la page de connexion.";
    msg.className = 'msg error';
  }

  document.querySelectorAll('.toggle-pw').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const isVisible = input.type === 'text';
      input.type = isVisible ? 'password' : 'text';
      btn.classList.toggle('is-visible', !isVisible);
      btn.setAttribute('aria-label', isVisible ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
    });
  });

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';

    const pw1 = document.getElementById('password').value;
    const pw2 = document.getElementById('password2').value;
    if (pw1 !== pw2) {
      showMsg('Les mots de passe ne correspondent pas.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Réinitialisation...';

    try {
      await _apiReady;
      const res = await fetch(`${API_BASE}/v1/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password: pw1 }),
      });
      const data = await res.json();

      if (!res.ok) {
        showMsg(data.detail || 'Échec de la réinitialisation.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Réinitialiser le mot de passe';
        return;
      }

      showMsg('Mot de passe réinitialisé — redirection vers la connexion...', 'success');
      setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    } catch (err) {
      showMsg('Impossible de contacter le serveur.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Réinitialiser le mot de passe';
    }
  });
</script>

</body>
</html>
