# ══════════════════════════════════════════════════════════════════════════════
#  render.yaml — Déploiement Render.com
#  Service : API FastAPI Maintenance Prédictive v3.1.0
#
#  Déploiement :
#    1. Connecter ce dépôt GitHub à Render
#    2. Render détecte ce fichier automatiquement
#    3. Cliquer "Apply" → le service démarre (~3 min)
# ══════════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: maintenance-predictive-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /health

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONIOENCODING
        value: "utf-8"
      - key: DEMO_MODE
        value: "true"
      # ── Auth API Key (OBLIGATOIRE — à définir dans le dashboard Render) ─────────
      # Générer : python -c "import secrets; print(secrets.token_hex(32))"
      - key: API_KEYS
        sync: false   # valeur saisie manuellement dans le dashboard Render, jamais exposée
      # ── MariaDB (optionnel — décommentez si vous exposez MariaDB publiquement) ──
      # - key: MARIADB_HOST
      #   sync: false
      # - key: MARIADB_PASSWORD
      #   sync: false
